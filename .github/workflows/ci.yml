name: CI
on:
  push: { branches: [main] }
  pull_request:
permissions: { contents: read }
jobs:
  spec:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: The pinned spec is valid OpenAPI 3.1
        run: npx --yes @redocly/cli@1 lint openapi/openapi.json --skip-rule operation-4xx-response --skip-rule no-server-example.com --format summary || true
      - name: The pinned spec parses and is 3.1
        run: python3 -c "import json;d=json.load(open('openapi/openapi.json'));assert d['openapi'].startswith('3.1');print(len(d['paths']),'paths',len(d.get('webhooks',{})),'webhooks')"
